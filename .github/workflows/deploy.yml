      #         --distribution-id E3HFKPA9NC5CGV \
      #         --paths "/*"

      # - name: Invalidate SLNP TEN
      #   run: |
      #     aws cloudfront create-invalidation \
      #         --distribution-id E2MW5P4BHI7R8J \
      #         --paths "/*"

